<!doctype html>
<meta charset="utf-8">
<title>dropit</title>
<link rel="stylesheet" href="popup.css">

<header id="top" hidden>
  <p class="wordmark"><img src="icon-32.png" alt="">dropit</p>
  <span class="plan" id="plan"></span>
  <!-- One button at the top right holds everything that is not sending: adding a device, theme, links, signing out -->
  <div class="menu-wrap">
    <button class="icon-btn" id="menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="menu" data-i18n-label="settings">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <div class="menu" id="menu" role="menu" hidden>
      <!-- Only a browser whose key may add devices (it created the account) shows it -->
      <button role="menuitem" id="add-device" type="button" hidden data-i18n="addDevice"></button>
      <!-- Only a browser whose key can read the device list, and only when there is another device to choose -->
      <button role="menuitem" id="defaults-open" class="has-value" type="button" hidden><span data-i18n="menuDefaults"></span><span class="val" id="defaults-val"></span></button>
      <!-- Only a browser that joined earlier with the send-only key (it cannot read anything yet) shows it -->
      <button role="menuitem" id="receive-open" type="button" hidden data-i18n="menuReceive"></button>
      <button role="menuitem" id="theme" type="button"></button>
      <!-- Not an action: this install's version and whether this browser can receive too -->
      <p class="menu-note" id="about"></p>
      <!-- Which account this is: a short code, only when the service sends one; select it to copy -->
      <p class="menu-note menu-account" id="account" hidden></p>
      <a role="menuitem" href="https://github.com/smart-kits/dropit-client" target="_blank" rel="noopener" data-i18n="source"></a>
      <a role="menuitem" id="issue" target="_blank" rel="noopener" data-i18n="issue"></a>
      <a role="menuitem" id="privacy" target="_blank" rel="noopener"></a>
      <button role="menuitem" class="warn" id="unpair" type="button" data-i18n="unpair"></button>
    </div>
  </div>
</header>

<!-- Joining is the usual case. Creating an account by mistake splits someone's items across two
     accounts, so it comes second, under its own "No account yet?". -->
<section class="setup" id="setup" hidden>
  <div class="hello">
    <p class="big"><img src="icon.png" alt="">dropit</p>
    <p data-i18n="tagline"></p>
  </div>
  <!-- The same airmail frame as the send box: this is the one thing to do here -->
  <div class="envelope join">
    <h1 data-i18n="setupTitle"></h1>
    <input type="text" id="code" maxlength="10" autocomplete="off" spellcheck="false">
    <button class="primary" id="claim" data-i18n="claim"></button>
  </div>
  <section class="how" aria-labelledby="how-title">
    <h2 id="how-title" data-i18n="howTitle"></h2>
    <ol class="steps">
      <li><span class="tb" data-icon="plus"><em aria-hidden="true">1</em></span><b data-i18n="step1T"></b><span data-i18n="step1B"></span></li>
      <li><i class="arr" data-icon="chev" aria-hidden="true"></i><span class="tb" data-icon="qr"><em aria-hidden="true">2</em></span><b data-i18n="step2T"></b><span data-i18n="step2B"></span></li>
      <li><i class="arr" data-icon="chev" aria-hidden="true"></i><span class="tb" data-icon="enter"><em aria-hidden="true">3</em></span><b data-i18n="step3T"></b><span data-i18n="step3B"></span></li>
    </ol>
  </section>
  <!-- Joining is the usual case; creating an account by mistake splits items across two accounts, so it is a quiet link -->
  <p class="between"><span data-i18n="firstTime"></span> <button class="quiet" id="create" type="button" data-i18n="create"></button></p>
  <!-- What joining sends, right where joining happens: the buttons say "Agree and …" -->
  <p class="note" id="consent"></p>
  <div class="notice" id="setup-returned" role="alert" hidden><b aria-hidden="true">!</b><span></span></div>
  <p class="note" id="setup-help" hidden><span></span> <a id="setup-up" href="#" hidden></a></p>
</section>

<!-- The default devices, from the menu: ticking saves at once -->
<section class="defaults" id="defaults" hidden>
  <div class="df-head">
    <button class="icon-btn" id="df-back" type="button" data-i18n-label="dfBack"><span data-icon="back"></span></button>
    <h1 data-i18n="dfTitle"></h1>
  </div>
  <p class="df-sub" data-i18n="dfSub"></p>
  <div class="df-bar"><span class="saved" id="df-saved" aria-live="polite"></span><button class="link all" id="df-all" type="button" data-i18n="tpAll"></button></div>
  <ul class="devs card" id="df-list"></ul>
  <p class="df-note" id="df-note"></p>
</section>

<!-- Turning receiving on in a browser that joined with a code: join again, this time with a full key -->
<section class="defaults receive" id="receive" hidden>
  <div class="df-head">
    <button class="icon-btn" id="rcv-back" type="button" data-i18n-label="dfBack"><span data-icon="back"></span></button>
    <h1 data-i18n="rcvTitle"></h1>
  </div>
  <p class="df-sub rcv-warn" data-i18n="rcvWarn"></p>
  <div class="envelope join">
    <input type="text" id="rcode" maxlength="10" autocomplete="off" spellcheck="false">
    <button class="primary" id="rcv-go" type="button" data-i18n="rcvGo"></button>
  </div>
  <div class="notice" id="rcv-returned" role="alert" hidden><b aria-hidden="true">!</b><span></span></div>
  <p class="df-note" data-i18n="rcvHow"></p>
</section>

<!-- Signing out asks first: what goes with it is said here, in full -->
<section class="defaults signout" id="signout" hidden>
  <div class="df-head">
    <button class="icon-btn" id="so-back" type="button" data-i18n-label="dfBack"><span data-icon="back"></span></button>
    <h1 data-i18n="soTitle"></h1>
  </div>
  <p class="df-sub rcv-warn" data-i18n="soBody"></p>
  <button class="primary" id="so-go" type="button" data-i18n="unpair"></button>
  <button class="secondary" id="so-cancel" type="button" data-i18n="soCancel"></button>
</section>

<section id="main" hidden>
  <!-- Enter sends; what it will send is said under the box, so there is never a choice to make -->
  <form class="envelope" id="send-form">
    <div class="line">
      <div class="field">
        <textarea id="compose" rows="1" enterkeyhint="send" autocomplete="off" spellcheck="false"></textarea>
        <button class="clip" id="choose" type="button" data-i18n-label="chooseFiles">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
        </button>
        <input type="file" id="files" multiple hidden>
      </div>
      <!-- One block to the right of the box: the red top is Send (straight to the default devices, nothing to choose); the
           light bottom says where that goes ("→ All") and opens the list of devices for this one send. With one other
           device there is no bottom: Send is the whole block. -->
      <div class="split" id="split">
        <button class="send" id="send" type="submit"><span class="lead" id="send-lead" data-icon="plane"></span><b id="stamp-word" data-i18n="stamp"></b></button>
        <button class="more" id="targets-btn" type="button" hidden aria-haspopup="dialog" aria-expanded="false" aria-controls="tpanel" data-i18n-label="targetsBtn">
          <span class="ic dv" data-icon="devices"></span><span class="dest" id="dest"></span><span class="ic dn" data-icon="down"></span>
        </button>
        <i class="prog" aria-hidden="true"></i>
        <div class="tpanel" id="tpanel" role="dialog" aria-labelledby="tp-title" hidden>
          <div class="tp-head"><h2 id="tp-title" data-i18n="tpTitle"></h2><button class="link all" id="tp-all" type="button" data-i18n="tpAll"></button></div>
          <p class="tp-sub" id="tp-sub" aria-live="polite"></p>
          <ul class="devs" id="tp-list"></ul>
          <p class="tp-keep" id="tp-keep" role="alert" hidden><span id="tp-keep-text"></span><button class="link" id="tp-keep-all" type="button" data-i18n="tpAll"></button></p>
          <button class="tp-send" id="tp-send" type="button"></button>
          <div class="tp-foot"><span data-i18n="tpNote"></span><button class="link" id="tp-default" type="button"></button></div>
        </div>
      </div>
    </div>
    <ul class="attached" id="attached" hidden></ul>
    <p class="will" id="will" aria-live="polite"></p>
    <p class="will" id="tnote" aria-live="polite"></p>
  </form>

<!-- Adding a device: a code and its QR, a countdown, and a quiet check for the new device joining.
     Shown right after creating an account, since that is the one sensible next step. -->
<section class="pair" id="pair" hidden>
  <div class="pair-head">
    <h2 id="pair-title"></h2>
    <button class="link x" id="pair-close" type="button">×</button>
  </div>
  <p class="making" id="pair-making" role="status" hidden><span class="spin" aria-hidden="true"></span><span id="pair-making-text"></span></p>
  <div class="pair-body" id="pair-body">
    <div class="qr" id="pair-qr"></div>
    <div class="pair-side">
      <p class="paircode" id="pair-code"></p>
      <p class="note" id="pair-left" aria-live="off"></p>
      <p class="note" id="pair-expired" hidden><span></span> <button class="link" id="pair-again" type="button" data-i18n="newCode"></button></p>
    </div>
  </div>
  <p class="note" id="pair-hint"></p>
  <p class="note" id="pair-install"></p>
  <p class="note replace" id="pair-replace" hidden><label for="pair-pick"></label><select id="pair-pick"></select></p>
  <div class="notice" id="pair-returned" role="alert" hidden><b aria-hidden="true">!</b><span></span></div>
</section>

  <!-- A send that came back stays here, with the way to try again, until the next edit or send -->
  <div class="card letter failed" id="failed" role="alert" hidden>
    <div class="row">
      <span class="tile" id="failed-tile"></span>
      <div class="body"><p class="tt" id="failed-title"></p><p class="mt" id="failed-meta"></p></div>
    </div>
    <p class="why"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.1"/></svg><span id="failed-why"></span></p>
    <a class="up" id="returned-up" href="#" hidden></a>
    <div class="svb2"><button class="kbtn solid" id="send-all" type="button" hidden></button><button class="kbtn" id="retry" type="button"></button></div>
  </div>

  <!-- What other devices sent: only for a browser that can read (full key). Fetched when this opens, or on Refresh -->
  <section id="received" hidden>
    <div class="sec-head">
      <h2 data-i18n="recvTitle"></h2>
      <button class="icon-btn sm" id="recv-refresh" type="button" aria-busy="false"><span data-icon="retry"></span></button>
    </div>
    <p class="recv-note" id="recv-note" aria-live="polite"></p>
    <a class="recv-up" id="recv-up" href="#" hidden></a>
    <ul class="letters" id="received-list"></ul>
    <p class="empty" id="recv-empty" data-i18n="recvEmpty" hidden></p>
  </section>

  <section id="recent" hidden>
    <h2 data-i18n="recentTitle"></h2>
    <ul class="letters" id="recent-list"></ul>
  </section>
  <p class="empty" id="empty" data-i18n="hint" hidden></p>
</section>

<script type="module" src="popup.js"></script>
