<!doctype html>
<meta charset="utf-8">
<title>dropit</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a18; --bg: #fbfbfa; --dim: #6b6b66; --line: #e4e4e0; --card: #fff; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e8e8e4; --bg: #16161a; --dim: #8a8a84; --line: #2c2c32; --card: #1e1e24; --accent: #fb923c; } }
  body { width: 280px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg);
         font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", sans-serif; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button { font: inherit; width: 100%; padding: 8px; margin-bottom: 6px; border-radius: 7px;
           border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button.cta { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .first { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  .first button { width: auto; padding: 0; margin: 0 0 0 4px; border: 0; background: none; color: var(--fg);
                  font-size: 12px; text-decoration: underline; text-underline-offset: 2px; }
  input { font: inherit; width: 100%; padding: 7px 9px; margin-bottom: 6px; border-radius: 7px;
          border: 1px solid var(--line); background: var(--card); color: var(--fg); box-sizing: border-box; }
  p { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  #msg { color: var(--accent); min-height: 18px; font-size: 12px; margin-top: 8px; }
  [hidden] { display: none !important; }
</style>

<!-- Joining is the usual case. Creating an account by mistake splits someone's items across two
     accounts, so it is a quiet link under the join form, not a button next to it. -->
<div id="setup" hidden>
  <h1 data-i18n="setupTitle"></h1>
  <input id="code" maxlength="10">
  <button class="cta" id="claim" data-i18n="claim"></button>
  <p data-i18n="setupNote"></p>
  <p class="first"><span data-i18n="firstTime"></span><button id="create" data-i18n="create"></button></p>
</div>

<div id="main" hidden>
  <h1 id="who"></h1>
  <button class="cta" id="page" data-i18n="page"></button>
  <button id="unpair" data-i18n="unpair"></button>
  <p data-i18n="mainNote"></p>
</div>

<div id="msg"></div>
<script type="module" src="popup.js"></script>
