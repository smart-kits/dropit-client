<!doctype html>
<meta charset="utf-8">
<title>dropit</title>
<link rel="stylesheet" href="popup.css">

<header>
  <p class="wordmark"><img src="icon-32.png" alt="">dropit</p>
  <span class="plan" id="plan"></span>
</header>

<!-- Joining is the usual case. Creating an account by mistake splits someone's items across two
     accounts, so it is a quiet link under the join form, not a button next to it. -->
<section class="envelope setup" id="setup" hidden>
  <h1 data-i18n="setupTitle"></h1>
  <div class="row">
    <input type="text" id="code" maxlength="10" autocomplete="off" spellcheck="false">
    <button class="solid" id="claim" data-i18n="claim"></button>
  </div>
  <p class="note" data-i18n="setupNote"></p>
  <!-- What joining sends, right where joining happens: the buttons say "Agree and …" -->
  <p class="note" id="consent"></p>
  <p class="first"><span data-i18n="firstTime"></span> <button class="link" id="create" data-i18n="create"></button></p>
  <div class="returned" id="setup-returned" role="alert" hidden><b data-i18n="returned"></b><span></span></div>
</section>

<section id="main" hidden>
  <!-- Enter sends; what it will send is said under the box, so there is never a choice to make -->
  <form class="envelope" id="send-form">
    <div class="compose">
      <textarea id="compose" rows="3" enterkeyhint="send" autocomplete="off" spellcheck="false"></textarea>
      <ul class="attached" id="attached" hidden></ul>
      <p class="will" id="will" aria-live="polite"></p>
    </div>
    <div class="stamp-wrap">
      <button class="stamp" id="send" type="submit"><span class="face"><b id="stamp-word" data-i18n="stamp"></b><small data-i18n="stampHint"></small></span></button>
    </div>
    <div class="returned" id="returned" role="alert" hidden><b data-i18n="returned"></b><span></span></div>
  </form>
  <div class="tools">
    <button class="link" id="choose" type="button">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.3-8.3"/></svg>
      <span data-i18n="chooseFiles"></span>
    </button>
    <input type="file" id="files" multiple hidden>
    <span class="hint" data-i18n="hint"></span>
  </div>
</section>

<!-- The public repository: see the code, or say what went wrong -->
<footer>
  <a href="https://github.com/smart-kits/dropit-client" target="_blank" rel="noopener" data-i18n="source"></a>
  <a id="issue" target="_blank" rel="noopener" data-i18n="issue"></a>
  <button class="link warn" id="unpair" type="button" data-i18n="unpair" hidden></button>
</footer>
<script type="module" src="popup.js"></script>
